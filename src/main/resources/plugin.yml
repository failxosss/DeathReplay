name: DeathReplay
version: ${project.version}
main: cz.deathreplay.DeathReplayPlugin
api-version: '1.21'
description: Records the last seconds before a player dies and lets admins replay them.
author: Failxos
commands:
  replay:
    description: Replay a player's death
    usage: /replay [list|play <id>|pause|speed <x>|seek <s>|cam <victim|killer|free>|restart|stop|delete <id>]
    aliases: [dreplay]
    permission: deathreplay.use
permissions:
  deathreplay.use:
    description: Allows playing death replays and receiving death notifications
    default: op
